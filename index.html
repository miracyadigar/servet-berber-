<script>
/* =====================================================================
   SUPABASE AYARLARI — Aşağıdaki 2 satıra kendi Supabase bilgilerini yaz!
   Supabase > Project Settings > API bölümünden kopyalayabilirsin.
   ===================================================================== */
const SUPABASE_URL = 'BURAYA_SUPABASE_PROJECT_URL_YAPISTIR';
const SUPABASE_ANON_KEY = 'BURAYA_SUPABASE_ANON_KEY_YAPISTIR';

/* ============ Sabitler & Yardımcılar ============ */
const LS = 'mirac_berber_v2';
const LS_AUTH = 'mirac_berber_pin_ok';
const $ = s => document.querySelector(s);
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const DAYS_S = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const longDate = s => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${DAYS[d.getDay()]}`; };
const money = n => (Math.round((n||0)*100)/100).toLocaleString('tr-TR') + ' ₺';
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const lc = s => String(s||'').toLocaleLowerCase('tr');
const cap = s => s ? s.charAt(0).toLocaleUpperCase('tr') + s.slice(1) : s;
const sum = (arr, fn) => arr.reduce((s, x) => s + fn(x), 0);
const INP = 'w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white';
const SHOP_PHONE_TXT = '0545 607 22 78';
const SHOP_WA = '905456072278';

const BARBER_POLE = `<svg width="30" height="44" viewBox="0 0 24 40" aria-hidden="true">

    <pattern id="ps" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="12" height="4" fill="#dc2626"/><rect y="4" width="12" height="4" fill="#ffffff"/><rect y="8" width="12" height="4" fill="#2563eb"/>
    </pattern>
  </defs>
  <rect x="4" y="2" width="16" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="4" y="34" width="16" height="4" rx="1.5" fill="#94a3b8"/>
  <g clip-path="url(#pc)"><rect x="6" y="6" width="12" height="28" fill="url(#ps)"/></g>
  <rect x="6" y="6" width="12" height="28" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1"/>
</svg>`;

const SQL_SETUP = `-- Miraç Berber Canlı Supabase Veritabanı Kurulumu
create table if not exists sb_settings (
  id text primary key,
  data jsonb not null,
  updated_at timestamptz default now()
);

create table if not exists sb_appointments (
  id text primary key,
  date text not null,
  time text not null,
  emp text not null,
  customer text not null,
  phone text default '',
  service text not null,
  price numeric default 0,
  status text default 'bekliyor',
  pay text,
  source text default 'panel',
  sample boolean default false,
  created_at timestamptz default now()
);

create table if not exists sb_cash (
  id text primary key,
  date text not null,
  time text not null,
  type text not null,
  desc_text text not null,
  method text not null,
  amount numeric not null,
  cat text not null,
  emp text,
  appt_id text,
  sample boolean default false,
  created_at timestamptz default now()
);

create table if not exists sb_debts (
  id text primary key,
  customer text not null,
  phone text default '',
  amount numeric not null,
  paid numeric default 0,
  date text not null,
  appt_id text,
  note text,
  sample boolean default false,
  created_at timestamptz default now()
);

alter table sb_settings enable row level security;
alter table sb_appointments enable row level security;
alter table sb_cash enable row level security;
alter table sb_debts enable row level security;

drop policy if exists "public_all_settings" on sb_settings;
create policy "public_all_settings" on sb_settings for all using (true) with check (true);

drop policy if exists "public_all_appts" on sb_appointments;
create policy "public_all_appts" on sb_appointments for all using (true) with check (true);

drop policy if exists "public_all_cash" on sb_cash;
create policy "public_all_cash" on sb_cash for all using (true) with check (true);

drop policy if exists "public_all_debts" on sb_debts;
create policy "public_all_debts" on sb_debts for all using (true) with check (true);`;

function ico(n){
  const p = {
    cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    wallet:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/>',
    book:'<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h8M8 12h6"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>'
  }[n];
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ============ Supabase İstemcisi ============ */
let sb = null;
let sbOnline = false;
let sbSyncTimer = null;

function initSupabase(){
  const validUrl = typeof SUPABASE_URL === 'string' && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('BURAYA_');
  const validKey = typeof SUPABASE_ANON_KEY === 'string' && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes('BURAYA_');
  if (validUrl && validKey && window.supabase && typeof window.supabase.createClient === 'function'){
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return true;
    } catch(e){ sb = null; }
  }
  return false;
}

/* ============ Veri Modeli ============ */
let db, undoSnap = null, confirmCb = null;

function seed(){
  const t = todayStr(), o5 = addDays(t,-5), o12 = addDays(t,-12), tm = addDays(t,1);
  const settings = {
    shop:'Miraç Berber', phone:SHOP_PHONE_TXT, wa:SHOP_WA, pin:'1234',
    employees:[{id:uid(),name:'Miraç Usta',rate:0},{id:uid(),name:'Çırak',rate:30}],
    services:[
      {id:uid(),name:'Saç Kesimi',price:300},{id:uid(),name:'Sakal',price:150},
      {id:uid(),name:'Saç + Sakal',price:400},{id:uid(),name:'Çocuk Tıraşı',price:200},
      {id:uid(),name:'Cilt Bakımı',price:250}
    ]
  };
  const appts = [], cash = [], debts = [];
  const mk = (date,time,emp,customer,phone,service,price,status,pay,source='panel') => {
    const id = uid();
    appts.push({id,date,time,emp,customer,phone,service,price,status,pay,source,sample:true});
    return id;
  };
  const cin = (id,time,desc,method,amount) => cash.push({id:uid(),date:t,time,type:'in',desc,method,amount,cat:'randevu',apptId:id,sample:true});

  let a = mk(t,'10:00','Miraç Usta','Mehmet Yılmaz','0532 111 22 33','Saç Kesimi',300,'odendi','nakit');
  cin(a,'10:40','Mehmet Yılmaz · Saç Kesimi','nakit',300);
  a = mk(t,'11:30','Çırak','Ali Kaya','0533 222 33 44','Sakal',150,'odendi','kart');
  cin(a,'12:00','Ali Kaya · Sakal','kart',150);
  a = mk(t,'14:00','Miraç Usta','Hasan Demir','0534 333 44 55','Saç + Sakal',400,'veresiye','veresiye');
  debts.push({id:uid(),customer:'Hasan Demir',phone:'0534 333 44 55',amount:400,paid:0,date:t,apptId:a,sample:true});
  mk(t,'17:30','Miraç Usta','Ahmet Çelik','0535 444 55 66','Saç Kesimi',300,'bekliyor',null,'online');
  mk(tm,'15:00','Çırak','Murat Aydın','0536 555 66 77','Çocuk Tıraşı',200,'bekliyor',null,'online');

  debts.push({id:uid(),customer:'Hasan Demir',phone:'0534 333 44 55',amount:250,paid:0,date:o5,apptId:null,note:'Eski borç',sample:true});
  debts.push({id:uid(),customer:'Emre Şahin',phone:'0537 666 77 88',amount:600,paid:0,date:o12,apptId:null,note:'Eski borç',sample:true});

  cash.push({id:uid(),date:t,time:'09:45',type:'out',desc:'Çay - şeker',method:'nakit',amount:80,cat:'masraf',sample:true});
  cash.push({id:uid(),date:t,time:'13:10',type:'out',desc:'Avans · Çırak',method:'nakit',amount:200,cat:'avans',emp:'Çırak',sample:true});
  return {settings, appts, cash, debts};
}

function loadLocal(){
  try { const r = localStorage.getItem(LS); if (r) db = JSON.parse(r); } catch(e){}
  if (!db || !db.settings || !Array.isArray(db.appts)) { db = seed(); saveLocal(); }
  db.cash = db.cash || []; db.debts = db.debts || [];
  if (db.settings.pin === undefined) db.settings.pin = '1234';
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(db)); } catch(e){} }

async function syncFromSupabase(silent){
  if (!sb) return;
  try {
    const [rS, rA, rC, rD] = await Promise.all([
      sb.from('sb_settings').select('data').eq('id','main').maybeSingle(),
      sb.from('sb_appointments').select('*'),
      sb.from('sb_cash').select('*'),
      sb.from('sb_debts').select('*')
    ]);
    if (rS.error || rA.error) throw (rS.error || rA.error);
    sbOnline = true;
    const prevOnlineIds = new Set(db.appts.filter(a => a.source === 'online').map(a => a.id));
    if (rS.data && rS.data.data){
      db.settings = rS.data.data;
    } else {
      await sb.from('sb_settings').upsert({id:'main', data:db.settings, updated_at:new Date().toISOString()});
    }
    if (Array.isArray(rA.data)){
      db.appts = rA.data.map(x => ({
        id:x.id, date:x.date, time:x.time, emp:x.emp, customer:x.customer,
        phone:x.phone||'', service:x.service, price:Number(x.price)||0,
        status:x.status||'bekliyor', pay:x.pay||null, source:x.source||'panel', sample:!!x.sample
      }));
    }
    if (Array.isArray(rC.data)){
      db.cash = rC.data.map(x => ({
        id:x.id, date:x.date, time:x.time, type:x.type, desc:x.desc_text,
        method:x.method, amount:Number(x.amount)||0, cat:x.cat, emp:x.emp||undefined,
        apptId:x.appt_id||undefined, sample:!!x.sample
      }));
    }
    if (Array.isArray(rD.data)){
      db.debts = rD.data.map(x => ({
        id:x.id, customer:x.customer, phone:x.phone||'', amount:Number(x.amount)||0,
        paid:Number(x.paid)||0, date:x.date, apptId:x.appt_id||null, note:x.note||'', sample:!!x.sample
      }));
    }
    saveLocal();
    if (silent && ui.mode === 'panel'){
      const newOnline = db.appts.find(a => a.source === 'online' && !prevOnlineIds.has(a.id));
      if (newOnline) toast(`Yeni online randevu: ${newOnline.customer} (${newOnline.time})`);
    }
    render();
  } catch(e){
    sbOnline = false;
    if (!silent) render();
  }
}

async function sbSaveSettings(){
  saveLocal();
  if (!sb) return;
  try { await sb.from('sb_settings').upsert({id:'main', data:db.settings, updated_at:new Date().toISOString()}); } catch(e){}
}
async function sbUpsertAppt(a){
  saveLocal();
  if (!sb) return;
  try {
    await sb.from('sb_appointments').upsert({
      id:a.id, date:a.date, time:a.time, emp:a.emp, customer:a.customer,
      phone:a.phone||'', service:a.service, price:a.price||0,
      status:a.status||'bekliyor', pay:a.pay||null, source:a.source||'panel', sample:!!a.sample
    });

}
async function sbDeleteAppt(id){
  saveLocal();
  if (!sb) return;
  try {
    await Promise.all([
      sb.from('sb_appointments').delete().eq('id', id),
      sb.from('sb_cash').delete().eq('appt_id', id),
      sb.from('sb_debts').delete().eq('appt_id', id)
    ]);
  } catch(e){}
}
async function sbUpsertCash(c){
  saveLocal();
  if (!sb) return;
  try {
    await sb.from('sb_cash').upsert({
      id:c.id, date:c.date, time:c.time, type:c.type, desc_text:c.desc,
      method:c.method, amount:c.amount, cat:c.cat, emp:c.emp||null,
      appt_id:c.apptId||null, sample:!!c.sample
    });
  } catch(e){}
}
async function sbDeleteCash(id){
  saveLocal();
  if (!sb) return;
  try { await sb.from('sb_cash').delete().eq('id', id); } catch(e){}
}
async function sbUpsertDebt(d){
  saveLocal();
  if (!sb) return;
  try {
    await sb.from('sb_debts').upsert({
      id:d.id, customer:d.customer, phone:d.phone||'', amount:d.amount,
      paid:d.paid||0, date:d.date, appt_id:d.apptId||null, note:d.note||'', sample:!!d.sample
    });
  } catch(e){}
}
async function sbSyncFull(){
  saveLocal();
  if (!sb) return;
  try {
    await sb.from('sb_settings').upsert({id:'main', data:db.settings, updated_at:new Date().toISOString()});
    await Promise.all([
      sb.from('sb_appointments').delete().neq('id','__none__'),
      sb.from('sb_cash').delete().neq('id','__none__'),
      sb.from('sb_debts').delete().neq('id','__none__')
    ]);
    if (db.appts.length) await sb.from('sb_appointments').insert(db.appts.map(a => ({
      id:a.id, date:a.date, time:a.time, emp:a.emp, customer:a.customer, phone:a.phone||'',
      service:a.service, price:a.price||0, status:a.status, pay:a.pay, source:a.source||'panel', sample:!!a.sample
    })));
    if (db.cash.length) await sb.from('sb_cash').insert(db.cash.map(c => ({
      id:c.id, date:c.date, time:c.time, type:c.type, desc_text:c.desc, method:c.method,
      amount:c.amount, cat:c.cat, emp:c.emp||null, appt_id:c.apptId||null, sample:!!c.sample
    })));
    if (db.debts.length) await sb.from('sb_debts').insert(db.debts.map(d => ({
      id:d.id, customer:d.customer, phone:d.phone||'', amount:d.amount, paid:d.paid||0,
      date:d.date, appt_id:d.apptId||null, note:d.note||'', sample:!!d.sample
    })));
  } catch(e){}
}

function save(){ saveLocal(); }
function snap(){ undoSnap = JSON.stringify(db); }

/* ============ Durum ============ */
function initialMode(){
  const h = (location.hash || '').toLowerCase();
  if (h.includes('panel') || h.includes('yonetim')) return 'panel';
  return 'customer';
}
function isPinUnlocked(){
  if (!db || !db.settings || !db.settings.pin) return true;
  try { return localStorage.getItem(LS_AUTH) === db.settings.pin; } catch(e){ return false; }
}
const ui = {
  mode: initialMode(),
  tab: 'rnd',
  selDate: todayStr(),
  k: {mode:'gun', date:todayStr()},
  c: {mode:'ay', date:todayStr()},
  hl: null,
  cust: {service:'', emp:'Fark etmez', date:todayStr(), time:'', name:'', phone:'', done:null}
};
let pending = null;

/* ============ Hesaplamalar ============ */
const debtRemain = d => d.amount - (d.paid||0);
function getPhone(name){
  const k = lc(name);
  for (const a of [...db.appts].reverse()) if (lc(a.customer)===k && a.phone) return a.phone;
  for (const d of [...db.debts].reverse()) if (lc(d.customer)===k && d.phone) return d.phone;
  return '';
}
function debtsByCustomer(){
  const m = {};
  db.debts.forEach(d => {
    const r = debtRemain(d); if (r <= 0.009) return;
    const k = lc(d.customer);
    if (!m[k]) m[k] = {key:k, name:d.customer, total:0, items:[], phone:''};
    m[k].total += r; m[k].items.push(d); m[k].phone = m[k].phone || d.phone || getPhone(d.customer);
  });
  return Object.values(m).sort((a,b) => b.total - a.total);
}
function customerDebt(name, excludeApptId){
  const k = lc(name);
  return sum(db.debts.filter(d => lc(d.customer)===k && d.apptId !== excludeApptId), debtRemain);
}
function waNum(p){
  let d = (p||'').replace(/\D/g,''); if (!d) return '';
  if (d.startsWith('90') && d.length >= 12) return d;
  if (d.startsWith('0')) d = '90' + d.slice(1); else if (d.length === 10) d = '90' + d;
  return d;
}
function waLink(phone, text){ const n = waNum(phone); return `https://wa.me/${n}?text=${encodeURIComponent(text)}`; }
function reminderText(a){
  return `Merhaba ${a.customer}, Miraç Berber'deki ${longDate(a.date)} saat ${a.time} (${a.service}) randevunuzu hatırlatmak isteriz. İletişim: ${SHOP_PHONE_TXT}`;
}
function debtText(name, total){
  return `Merhaba ${name}, Miraç Berber'de ${money(total)} veresiye bakiyeniz görünmektedir. Müsait olduğunuzda ödemenizi rica ederiz. Teşekkürler. İletişim: ${SHOP_PHONE_TXT}`;
}
function bookingShareUrl(){
  try {
    const base = location.href.split('#')[0].split('?')[0];
    if (base.startsWith('http')) return base;
  } catch(e){}
  return 'https://miracyadigar.github.io/servet-berber-/';
}
function rangeOf(m, d){
  if (m === 'gun') return [d, d];
  const dt = parseYmd(d);
  if (m === 'hafta'){ const wd = (dt.getDay()+6)%7; const f = addDays(d,-wd); return [f, addDays(f,6)]; }
  return [ymd(new Date(dt.getFullYear(), dt.getMonth(), 1)), ymd(new Date(dt.getFullYear(), dt.getMonth()+1, 0))];
}
function shiftDate(m, d, n){
  if (m === 'gun') return addDays(d, n);
  if (m === 'hafta') return addDays(d, 7*n);
  const dt = parseYmd(d); return ymd(new Date(dt.getFullYear(), dt.getMonth()+n, 1));
}
function rangeLabel(m, d){
  const [f,t] = rangeOf(m,d);
  if (m === 'gun') return d === todayStr() ? 'Bugün · ' + longDate(d) : longDate(d);
  if (m === 'hafta'){ const a = parseYmd(f), b = parseYmd(t); return `${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0,3)}`; }
  const a = parseYmd(f); return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
}
function stats(m, d){
  const [f,t] = rangeOf(m,d); const inR = x => x >= f && x <= t;
  const cash = db.cash.filter(c => inR(c.date));
  const ins = cash.filter(c => c.type==='in'), outs = cash.filter(c => c.type==='out');
  const inTotal = sum(ins,c=>c.amount), outTotal = sum(outs,c=>c.amount);
  const outAvans = sum(outs.filter(c=>c.cat==='avans'),c=>c.amount);
  return {f,t,cash,ins,outs,inTotal,outTotal,
    inNakit:sum(ins.filter(c=>c.method==='nakit'),c=>c.amount),
    inKart:sum(ins.filter(c=>c.method==='kart'),c=>c.amount),
    outAvans, outMasraf: outTotal - outAvans,
    vere: sum(db.debts.filter(x=>inR(x.date)),x=>x.amount)};
}

/* ============ Randevu / Ödeme İşlemleri ============ */
function addAppt(o){
  const a = {id:uid(), date:o.date, time:o.time, emp:o.emp, customer:o.customer, phone:o.phone||'', service:o.service, price:+o.price||0, status:'bekliyor', pay:null, source:o.source||'panel'};
  db.appts.push(a);
  sbUpsertAppt(a);
  return a;
}
function paidDebtGuard(id){
  return db.debts.some(d => d.apptId === id && (d.paid||0) > 0);
}
function clearPayment(id){
  const oldCash = db.cash.filter(c => c.apptId === id);
  const oldDebts = db.debts.filter(d => d.apptId === id);
  db.cash = db.cash.filter(c => c.apptId !== id);
  db.debts = db.debts.filter(d => d.apptId !== id);
  const a = db.appts.find(x => x.id === id);
  if (a){ a.status = 'bekliyor'; a.pay = null; sbUpsertAppt(a); }
  if (sb){
    oldCash.forEach(c => sbDeleteCash(c.id));
    oldDebts.forEach(d => { try { sb.from('sb_debts').delete().eq('id', d.id); } catch(e){} });
  }
}
function payAppt(id, method, amount){
  const a = db.appts.find(x => x.id === id); if (!a) return;
  clearPayment(id);
  a.price = +amount || 0;
  if (method === 'veresiye'){
    a.status = 'veresiye'; a.pay = 'veresiye';
    const dObj = {id:uid(), customer:a.customer, phone:a.phone||'', amount:a.price, paid:0, date:todayStr(), apptId:id};
    db.debts.push(dObj);
    sbUpsertAppt(a); sbUpsertDebt(dObj);
  } else {
    a.status = 'odendi'; a.pay = method;
    const cObj = {id:uid(), date:todayStr(), time:nowTime(), type:'in', desc:`${a.customer} · ${a.service}`, method, amount:a.price, cat:'randevu', apptId:id};
    db.cash.push(cObj);
    sbUpsertAppt(a); sbUpsertCash(cObj);
  }
}
function collectDebt(name, amount, method){
  const k = lc(name);
  const items = db.debts.filter(d => lc(d.customer)===k && debtRemain(d) > 0.009).sort((a,b) => a.date.localeCompare(b.date));
  let left = amount, taken = 0;
  for (const d of items){
    if (left <= 0) break;
    const t = Math.min(left, debtRemain(d));
    d.paid = (d.paid||0) + t; left -= t; taken += t;
    sbUpsertDebt(d);
  }
  if (taken > 0){
    const cObj = {id:uid(), date:todayStr(), time:nowTime(), type:'in', desc:`Veresiye tahsilat · ${name}`, method, amount:taken, cat:'tahsilat'};
    db.cash.push(cObj); sbUpsertCash(cObj);
  }
  return taken;
}

function segVal(name){ const el = document.querySelector(`[data-seg="${name}"] .segon`); return el ? el.dataset.v : null; }
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };

function copyText(text, okMsg){
  const done = () => toast(okMsg || 'Kopyalandı');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Kopyalanamadı, elle seçin'); }
  ta.remove();
}

function viewCirak(){
  const st = ui.c, [f,t] = rangeOf(st.mode, st.date), inR = x => x >= f && x <= t;
  const cards = db.settings.employees.map(e => {
    const ops = db.appts.filter(a => inR(a.date) && a.emp === e.name && a.status !== 'bekliyor');
    const rev = sum(ops, a => a.price);
    const adv = db.cash.filter(c => c.cat==='avans' && c.emp===e.name && inR(c.date)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    const advT = sum(adv, c => c.amount), earn = rev * (e.rate||0) / 100, left = earn - advT;
    const payBlock = e.rate > 0 ? `<div class="grid grid-cols-2 gap-2 mt-3 text-sm">
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-500">Hak ediş (%${e.rate})</div><div class="font-bold">${money(earn)}</div></div>
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-500">Verilen avans</div><div class="font-bold text-red-600">${money(advT)}</div></div></div>
      <div class="mt-2 rounded-xl p-3 ${left>=0?'bg-green-50':'bg-red-50'}"><div class="text-xs text-slate-500">${left>=0?'KALAN ÖDENECEK':'FAZLA AVANS (borçlu)'}</div><div class="text-2xl font-extrabold ${left>=0?'text-green-600':'text-red-600'}">${money(Math.abs(left))}</div></div>`
      : `<div class="mt-3 bg-slate-50 rounded-xl p-3 text-sm"><div class="text-xs text-slate-500">Verilen avans</div><div class="font-bold text-red-600">${money(advT)}</div><div class="text-xs text-slate-400 mt-1">Hak ediş yüzdesi Ayarlar'dan girilebilir.</div></div>`;
    const advList = adv.length ? `<div class="mt-3 text-xs text-slate-500">${adv.map(c => `${parseYmd(c.date).getDate()} ${MONTHS[parseYmd(c.date).getMonth()].slice(0,3)} · ${money(c.amount)}`).join('<br>')}</div>` : '';
    return `<div class="card p-4 mb-3"><div class="flex justify-between items-start"><div><div class="text-lg font-bold">${esc(e.name)}</div>
      <div class="text-sm text-slate-500">${ops.length} işlem · ciro ${money(rev)}</div></div>
      <button data-a="avans" data-e="${esc(e.name)}" class="bg-red-600 text-white font-bold rounded-full px-4 py-2 text-sm">+ Avans Ver</button></div>${payBlock}${advList}</div>`;
  }).join('');
  return `${periodBar('c')}${cards}<div class="text-xs text-slate-400 text-center mt-2">Avanslar kasadan otomatik düşer.</div>`;
}

  const it = (id, ic, lbl) => `<button data-a="tab" data-t="${id}" class="navb ${ui.tab===id?'on':''}">${ico(ic)}<span>${lbl}</span></button>`;

function render(){
  renderHeader();
  renderNav();
  if (ui.mode === 'customer'){
    $('#main').innerHTML = viewCustomer();
    return;
  }
  if (!isPinUnlocked()){
    $('#main').innerHTML = viewPinLock();
    return;
  }
  const v = {rnd:viewRnd, kas:viewKasa, ver:viewVer, cir:viewCirak}[ui.tab];
  $('#main').innerHTML = v();

    const s = $('#strip'), el = s && s.querySelector('.sel');

function nextFree(date){
  const taken = new Set(db.appts.filter(a => a.date === date).map(a => a.time)), nowT = nowTime();
  for (let m = 9*60; m <= 21*60; m += 30){
    const s = pad(Math.floor(m/60)) + ':' + pad(m%60);
    if (taken.has(s)) continue; if (date === todayStr() && s < nowT) continue; return s;
  }
  return '10:00';
}

/* ============ Sesli Komut: Ayrıştırma ============ */
const NW = {sıfır:0,bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9,on:10,yirmi:20,otuz:30,kırk:40,elli:50,altmış:60,yetmiş:70,seksen:80,doksan:90,yüz:100,bin:1000};
const SUF = ['','te','ta','de','da','ye','ya','e','a'];
function numTok(w){
  for (const [k,v] of Object.entries(NW)){
    if (w.startsWith(k)){ const r = w.slice(k.length).replace(/^'/,''); if (SUF.includes(r)) return {v, suf:r}; }
  }
  return null;
}
function wordsToDigits(s){
  const toks = s.split(/\s+/).filter(Boolean), out = []; let i = 0;
  while (i < toks.length){
    if (!numTok(toks[i])){ out.push(toks[i]); i++; continue; }
    let total = 0, cur = 0, suf = '';
    while (i < toks.length){
      const n = numTok(toks[i]); if (!n) break;
      if (n.v === 100) cur = (cur||1)*100; else if (n.v === 1000){ total += (cur||1)*1000; cur = 0; } else cur += n.v;
      suf = n.suf; i++;
    }
    out.push(String(total+cur) + (suf ? "'" + suf : ''));
  }
  return out.join(' ');
}
const norm = s => lc(s).replace(/[’‘`´]/g,"'").replace(/[.,!?;]+(\s|$)/g,' ').replace(/\s+/g,' ').trim();
function getAmount(s){
  let m = s.match(/(\d[\d.]*)\s*(?:lira|tl|₺)/);
  if (!m) m = s.match(/(\d[\d.]*)/);
  if (!m) return 0;
  const v = parseFloat(m[1].replace(/\./g,'')); return isNaN(v) ? 0 : v;
}
function hh(h, mi){ if (h <= 8) h += 12; if (h > 23 || mi > 59) return null; return pad(h) + ':' + pad(mi); }
function getTime(s){
  let m = s.match(/\b(\d{1,2})[:.](\d{2})\b/); if (m) return hh(+m[1], +m[2]);
  m = s.match(/saat\s+(\d{1,2})(?:'?(?:te|ta|de|da|e|a|ye|ya))?(?:\s+(buçuk))?/); if (m) return hh(+m[1], m[2] ? 30 : 0);
  m = s.match(/\b(\d{1,2})\s*'?\s*(?:te|ta|de|da)(?:\s|$)/); if (m) return hh(+m[1], 0);
  m = s.match(/\b(\d{1,2})\s+buçuk/); if (m) return hh(+m[1], 30);
  return null;
}
function getDay(s){
  const t = todayStr();
  if (/öbür\s*gün|ertesi gün/.test(s)) return addDays(t,2);
  if (s.includes('yarın')) return addDays(t,1);
  if (s.includes('bugün')) return t;
  const wd = [['pazartesi',1],['cumartesi',6],['perşembe',4],['çarşamba',3],['pazar',0],['salı',2],['cuma',5]];
  for (const [n,i] of wd) if (s.includes(n)){ let diff = (i - new Date().getDay() + 7) % 7; if (diff === 0) diff = 7; return addDays(t, diff); }
  return t;
}
function dayWord(d){ const t = todayStr(); return d === t ? 'Bugün' : d === addDays(t,1) ? 'Yarın' : longDate(d); }
function pickService(s){
  const sv = db.settings.services, has = k => s.includes(k);
  const find = (...ks) => sv.find(x => { const n = lc(x.name); return ks.every(k => n.includes(k)); });
  if (has('çocuk')) return find('çocuk') || null;
  if (has('cilt') || has('bakım')) return find('cilt') || null;
  if (has('saç') && has('sakal')) return find('saç','sakal') || null;
  if (has('sakal')) return sv.find(x => { const n = lc(x.name); return n.includes('sakal') && !n.includes('saç'); }) || null;
  if (has('saç') || has('kesim') || has('tıraş')) return find('saç','kesim') || find('saç') || null;
  return null;
}
function pickEmp(s){
  for (const e of db.settings.employees){
    for (const w of lc(e.name).split(/\s+/)){
      const stem = w.length > 3 ? w.slice(0, -1) : w;
      if (stem.length >= 3 && s.includes(stem)) return e.name;
    }
  }
  return null;
}
const STOP = ['yarın','bugün','öbür','gün','ertesi','saat','randevu','yaz','yazın','için','bir','saç','sakal','kesim','kesimi','tıraş','tıraşı','çocuk','cilt','bakım','bakımı','ve','ile','buçuk','verdi','ödedi','lira','tl','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi','pazar','usta','ustaya','miraç','servet','çırak','çırağa','veresiye','avans','verdim','aldım','tahsil','istiyor','gelecek','geliyor','te','ta','de','da','+','₺','kart','nakit','ile','olarak','kartla','nakitle','ödeme','yaptı','getirdi','ona','kaydet','ekle'];
function getName(s){
  let t = s.replace(/\d{1,2}[:.]\d{2}/g,' ').replace(/\d+(?:['’][^\s]*)?[a-zçğıöşü]{0,3}/g,' ');
  const toks = t.split(/\s+/).map(w => w.replace(/'.*$/,'')).filter(w => w && !STOP.includes(w));
  return toks.slice(0,2).map(cap).join(' ');
}
const EXP_RE = /fatura|kira|masraf|gider|elektrik|doğalgaz|internet|malzeme|alışveriş|harcad|ödedim/;

function parseCommand(raw){
  const s = wordsToDigits(norm(raw));
  if (!s) return {type:'unknown'};
  const t = todayStr(), amt = getAmount(s);

  if (/kim/.test(s) && /(borç|veresiye|alacak)/.test(s) || /toplam (veresiye|borç|alacak)/.test(s)) return {type:'q_debt'};
  if (/(kazan|ciro|gelir|kasa|cebe)/.test(s) && /(ne kadar|kaç|kaldı)/.test(s)){
    let mode = 'gun', date = t;
    if (s.includes('hafta')) mode = 'hafta'; else if (s.includes('bu ay') || s.includes('aylık')) mode = 'ay'; else if (s.includes('dün')) date = addDays(t,-1);
    return {type:'q_earn', mode, date};
  }
  if (/kaç (randevu|müşteri)/.test(s)) return {type:'q_appt', date:getDay(s)};

  if (s.includes('avans') && amt){
    const emp = pickEmp(s) || (db.settings.employees.find(e => lc(e.name).includes('çırak')) || db.settings.employees[1] || db.settings.employees[0]).name;
    return {type:'avans', emp, amount:amt, summary:`Avans · ${emp} · ${money(amt)} (kasadan düşer)`};
  }
  if (s.includes('veresiye') && amt){
    const name = getName(s); if (!name) return {type:'unknown'};
    return {type:'veresiye', name, amount:amt, summary:`Veresiye · ${name} · ${money(amt)}`};
  }
  if (amt && EXP_RE.test(s)){
    let d = s.replace(/\d[\d.]*\s*(lira|tl|₺)?/g,' ').replace(/\b(ödedim|yaz|gider|olarak|harcadım)\b/g,' ').replace(/\s+/g,' ').trim();
    d = cap(d) || 'Masraf';
    return {type:'expense', desc:d, amount:amt, summary:`Gider · ${d} · ${money(amt)}`};
  }
  if (amt && /(^|\s)(verdi|ödedi|getirdi|tahsil|aldım)(\s|$)/.test(s)){
    const name = getName(s), method = s.includes('kart') ? 'kart' : 'nakit';
    const k = lc(name);
    const hit = name ? db.appts.filter(a => a.date === t && a.status === 'bekliyor' && (lc(a.customer).includes(k) || k.includes(lc(a.customer).split(' ')[0]))).sort((a,b)=>a.time.localeCompare(b.time))[0] : null;
    if (hit) return {type:'pay_appt', apptId:hit.id, method, amount:amt, summary:`Ödeme · ${hit.customer} · ${hit.time} ${hit.service} · ${money(amt)} · ${method}`};
    const dc = name ? debtsByCustomer().find(c => c.key.includes(k) || k.includes(c.key.split(' ')[0])) : null;
    if (dc){ const a2 = Math.min(amt, dc.total); return {type:'collect', name:dc.name, method, amount:a2, summary:`Veresiye tahsilat · ${dc.name} · ${money(a2)} · ${method}`}; }
    return {type:'cash_in', desc:(name || 'Müşteri') + ' ödeme', method, amount:amt, summary:`Para girdi · ${name || 'Müşteri'} · ${money(amt)} · ${method}`};
  }
  const time = getTime(s), svc = pickService(s);
  if (time || svc || s.includes('randevu')){
    const date = getDay(s), sv = svc || db.settings.services[0];
    const emp = pickEmp(s) || db.settings.employees[0].name;
    const name = getName(s) || 'Müşteri', tm = time || nextFree(date);
    const clash = db.appts.some(a => a.date === date && a.time === tm);
    return {type:'appt', data:{date, time:tm, emp, customer:name, phone:getPhone(name), service:sv.name, price:sv.price},
      summary:`Randevu · ${dayWord(date)} ${tm} · ${name} · ${sv.name} · ${money(sv.price)}`,
      note: clash ? 'Dikkat: bu saatte başka bir randevu var.' : (time ? '' : 'Saat söylemediniz, ilk boş saat seçildi.')};
  }
  return {type:'unknown'};
}

const EXAMPLES = ["Yarın saat 3'te Ahmet saç sakal","Mehmet 300 lira verdi","Hasan'a 200 lira veresiye yaz","Çırağa 500 lira avans verdim","Bugün ne kadar kazandım","Kim ne kadar borçlu","Elektrik faturası 1240 lira"];
let rec = null, listening = false;

function openVoice(){
  sheet(`${sheetHead('Sesle Söyle')}
  <div class="flex flex-col items-center py-2">
    <button data-a="mictoggle" id="micbtn" class="w-24 h-24 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg">${ico('mic').replace('width="24" height="24"','width="44" height="44"')}</button>
    <div id="vstat" class="text-sm text-slate-500 mt-3 text-center min-h-[20px]">Mikrofona dokunup konuşun</div>
  </div>

    <input id="vin" class="${INP}" placeholder="ya da buraya yazın..." autocomplete="off">

  <div id="vres" class="mt-4"></div>

  startListening();
}
function setStat(t){ const e = $('#vstat'); if (e) e.textContent = t; }
function micState(on){ const b = $('#micbtn'); if (b) b.classList.toggle('pulse', on); if (on) setStat('Dinliyorum… konuşun'); }
function startListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ setStat('Bu tarayıcı sesli komutu desteklemiyor. Aşağıya yazabilirsiniz.'); return; }
  stopListening();
  try {
    rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let got = false;
    rec.onstart = () => { listening = true; micState(true); };
    rec.onresult = e => {
      let full = '', fin = false;
      for (let i = 0; i < e.results.length; i++){ full += e.results[i][0].transcript; if (e.results[i].isFinal) fin = true; }
      const inp = $('#vin'); if (inp) inp.value = full;
      if (fin){ got = true; runVoice(full); }
    };
    rec.onerror = e => {
      listening = false; micState(false);
      setStat(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Mikrofon izni verilmedi. Aşağıya yazabilirsiniz.' :
              e.error === 'no-speech' ? 'Ses duyulmadı. Tekrar deneyin veya yazın.' : 'Ses algılanamadı. Yazarak deneyebilirsiniz.');
    };
    rec.onend = () => { listening = false; micState(false); if (!got && $('#vstat') && /Dinliyorum/.test($('#vstat').textContent)) setStat('Mikrofona dokunup konuşun'); };
    rec.start();
  } catch (err){ setStat('Mikrofon başlatılamadı. Aşağıya yazabilirsiniz.'); }
}
function stopListening(){
  if (rec){ try { rec.onend = null; rec.onerror = null; rec.onresult = null; rec.stop(); } catch(e){} rec = null; }
  listening = false;
}
function runVoice(text){
  text = (text || '').trim(); if (!text) return;
  const it = parseCommand(text), box = $('#vres'); if (!box) return;
  pending = null;
  if (it.type === 'unknown'){
    box.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-2xl p-4 text-red-800 text-sm">Anlayamadım: “${esc(text)}”<br>Aşağıdaki örneklere benzer şekilde söyleyebilir veya yazabilirsiniz.</div>`;
    return;
  }
  if (it.type.startsWith('q_')){ box.innerHTML = answerCard(it); return; }
  pending = it;
  const label = {appt:'RANDEVU',pay_appt:'ÖDEME',collect:'TAHSİLAT',cash_in:'PARA GİRDİ',veresiye:'VERESİYE',avans:'AVANS',expense:'GİDER'}[it.type];
  box.innerHTML = `<div class="bg-slate-50 border border-slate-200 rounded-2xl p-4"><div class="text-xs font-bold text-slate-500 mb-1">${label} · ONAYLIYOR MUSUNUZ?</div>
    <div class="text-lg font-bold">${esc(it.summary)}</div>${it.note?`<div class="text-sm text-amber-700 mt-1">${esc(it.note)}</div>`:''}</div>
    <div class="grid grid-cols-2 gap-2 mt-3"><button data-a="vok" class="py-3.5 rounded-xl bg-green-600 text-white font-bold">Tamam, kaydet</button>
    <button data-a="vagain" class="py-3.5 rounded-xl bg-white border border-slate-300 font-semibold">Yeniden söyle</button></div>`;
}
function answerCard(it){
  let title = '', body = '';
  if (it.type === 'q_earn'){
    const s = stats(it.mode, it.date), net = s.inTotal - s.outTotal;
    title = (it.mode==='gun' ? (it.date===todayStr()?'Bugün':longDate(it.date)) : it.mode==='hafta' ? 'Bu hafta' : 'Bu ay');
    body = `<div class="text-3xl font-extrabold text-green-600">${money(s.inTotal)}</div><div class="text-sm text-slate-600 mt-1">kasaya girdi (nakit ${money(s.inNakit)}, kart ${money(s.inKart)})</div>
      <div class="text-sm text-slate-600">Çıkan: ${money(s.outTotal)} · Cebe kalan: <b>${money(net)}</b></div><div class="text-sm" style="color:#d97706">Veresiye yazılan: ${money(s.vere)}</div>`;
  } else if (it.type === 'q_debt'){
    const l = debtsByCustomer(); title = 'Veresiye durumu';
    body = l.length ? `<div class="text-3xl font-extrabold" style="color:#d97706">${money(sum(l,c=>c.total))}</div><div class="text-sm text-slate-500 mb-2">toplam alacak</div>` + l.slice(0,8).map(c => `<div class="flex justify-between py-1 border-b border-slate-100 last:border-0"><span>${esc(c.name)}</span><b>${money(c.total)}</b></div>`).join('') : '<div class="text-slate-600">Kimsenin veresiye borcu yok.</div>';
  } else if (it.type === 'q_appt'){
    const n = db.appts.filter(a => a.date === it.date).length; title = dayWord(it.date);
    body = `<div class="text-3xl font-extrabold">${n}</div><div class="text-sm text-slate-600">randevu var</div>`;
  }
  return `<div class="bg-slate-50 border border-slate-200 rounded-2xl p-4"><div class="text-xs font-bold text-slate-500 mb-1">${esc(title.toUpperCase())}</div>${body}</div>`;
}
function applyIntent(it){
  snap();
  let msg = 'Kaydedildi';
  const t = todayStr(), tm = nowTime();
  switch (it.type){
    case 'appt': addAppt(it.data); ui.selDate = it.data.date; ui.tab = 'rnd'; msg = 'Randevu Yazıldı'; break;
    case 'pay_appt': payAppt(it.apptId, it.method, it.amount); msg = 'Ödeme alındı'; break;
    case 'collect': collectDebt(it.name, it.amount, it.method); msg = 'Tahsilat kaydedildi'; break;
    case 'cash_in': { const c={id:uid(),date:t,time:tm,type:'in',desc:it.desc,method:it.method,amount:it.amount,cat:'diger'}; db.cash.push(c); sbUpsertCash(c); msg = 'Para girişi kaydedildi'; break; }
    case 'veresiye': { const d={id:uid(),customer:it.name,phone:getPhone(it.name),amount:it.amount,paid:0,date:t,apptId:null}; db.debts.push(d); sbUpsertDebt(d); msg = 'Veresiye yazıldı'; break; }
    case 'avans': { const c={id:uid(),date:t,time:tm,type:'out',desc:'Avans · '+it.emp,method:'nakit',amount:it.amount,cat:'avans',emp:it.emp}; db.cash.push(c); sbUpsertCash(c); msg = 'Avans kasadan düşüldü'; break; }
    case 'expense': { const c={id:uid(),date:t,time:tm,type:'out',desc:it.desc,method:'nakit',amount:it.amount,cat:'masraf'}; db.cash.push(c); sbUpsertCash(c); msg = 'Gider kaydedildi'; break; }
  }

  delappt: d => {
    if (paidDebtGuard(d.id)){ toast('Veresiye tahsilatı yapılmış, silinemez'); return; }
    askConfirm('Bu randevu silinsin mi?', () => {
      snap(); db.appts = db.appts.filter(a => a.id !== d.id);
      db.cash = db.cash.filter(c => c.apptId !== d.id);
      db.debts = db.debts.filter(x => x.apptId !== d.id);
      sbDeleteAppt(d.id); render(); toast('Randevu silindi', true);
    });
  },
  gor: d => { closeSheet(); ui.tab = 'ver'; ui.hl = d.c; render(); const el = document.getElementById('cust-' + d.c.replace(/\s+/g,'_')); if (el) el.scrollIntoView({block:'center', behavior:'smooth'}); setTimeout(() => { ui.hl = null; const e2 = document.getElementById('cust-' + d.c.replace(/\s+/g,'_')); if (e2) e2.classList.remove('hl'); }, 2500); },
  pmode: d => { ui[d.s].mode = d.m; render(); },
  pshift: d => { const st = ui[d.s]; st.date = shiftDate(st.mode, st.date, +d.n); render(); },
  ptoday: d => { ui[d.s].date = todayStr(); render(); },
  cashin: () => openCash('in'),
  cashout: () => openCash('out'),
  savecash: d => {
    const amount = numVal('c_amount'); if (amount <= 0){ toast('Tutarı yazın'); return; }
    const type = d.type, method = segVal('cm') || 'nakit', cat = type === 'out' ? val('c_cat') : 'diger';
    let desc = val('c_desc').trim(), emp;
    if (cat === 'avans'){ emp = val('c_emp'); desc = desc || 'Avans · ' + emp; }
    desc = desc || (type === 'in' ? 'Para girişi' : 'Masraf');
    snap();
    const cObj = {id:uid(), date:todayStr(), time:nowTime(), type, desc, method, amount, cat, ...(emp?{emp}:{})};
    db.cash.push(cObj); sbUpsertCash(cObj);
    closeSheet(); render(); toast(type === 'in' ? 'Para girişi kaydedildi' : 'Çıkış kaydedildi', true);
  },
  delcash: d => {
    askConfirm('Bu kasa hareketi silinsin mi?', () => {
      snap(); db.cash = db.cash.filter(c => c.id !== d.id); sbDeleteCash(d.id); render(); toast('Hareket silindi', true);
    });
  },
  avans: d => openAvans(d.e),
  saveavans: () => {
    const amount = numVal('v_amount'), emp = val('v_emp'); if (amount <= 0){ toast('Tutarı yazın'); return; }
    snap();
    const cObj = {id:uid(), date:todayStr(), time:nowTime(), type:'out', desc:'Avans · ' + emp, method:'nakit', amount, cat:'avans', emp};
    db.cash.push(cObj); sbUpsertCash(cObj);
    closeSheet(); render(); toast('Avans kasadan düşüldü', true);
  },
  tahsil: d => openTahsil(d.k),
  savetahsil: d => {
    const c = debtsByCustomer().find(x => x.key === d.k); if (!c) return;
    let amount = numVal('t_amount'); if (amount <= 0){ toast('Tutarı yazın'); return; }
    amount = Math.min(amount, c.total);
    snap(); collectDebt(c.name, amount, segVal('tm') || 'nakit'); closeSheet(); render(); toast('Tahsilat kasaya eklendi', true);
  },
  wadebt: d => { const c = debtsByCustomer().find(x => x.key === d.k); if (c) window.open(waLink(c.phone, debtText(c.name, c.total)), '_blank'); },
  adddebt: () => openAddDebt(),
  savedebt: () => {
    const name = val('r_name').trim(), amount = numVal('r_amount');
    if (!name || amount <= 0){ toast('Ad ve tutarı yazın'); return; }
    snap();
    const dObj = {id:uid(), customer:name, phone:val('r_phone').trim() || getPhone(name), amount, paid:0, date:todayStr(), apptId:null, note:val('r_note').trim()};
    db.debts.push(dObj); sbUpsertDebt(dObj);
    closeSheet(); render(); toast('Veresiye yazıldı', true);
  },
  settings: () => openSettings(),
  copycust: () => copyText(val('cust_share_url'), 'Müşteri randevu linki kopyalandı'),
  copysql: () => copyText(SQL_SETUP, 'Supabase SQL kodu kopyalandı'),
  syncnow: () => { if (!sb){ toast('Önce index.html içindeki Supabase bilgilerini girin'); return; } syncFromSupabase(false); toast('Veriler eşitlendi'); },
  addemp: () => { db.settings.employees.push({id:uid(), name:'Yeni Çalışan', rate:0}); sbSaveSettings(); openSettings(); render(); },
  delemp: d => {
    if (db.settings.employees.length <= 1){ toast('En az bir çalışan kalmalı'); return; }
    askConfirm('Çalışan listeden kaldırılsın mı?', () => { db.settings.employees.splice(+d.i, 1); sbSaveSettings(); openSettings(); render(); });
  },
  addsvc: () => { db.settings.services.push({id:uid(), name:'Yeni Hizmet', price:100}); sbSaveSettings(); openSettings(); },
  delsvc: d => {
    if (db.settings.services.length <= 1){ toast('En az bir hizmet kalmalı'); return; }
    db.settings.services.splice(+d.i, 1); sbSaveSettings(); openSettings();
  },
  copylink: () => copyText(val('wa_link'), 'WhatsApp linki kopyalandı'),
  backup: () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `mirac-berber-yedek-${todayStr()}.json`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Yedek indirildi');
  },
  restore: () => $('#restoreIn').click(),
  clearsample: () => {
    askConfirm('Örnek (demo) kayıtlar silinsin mi? Kendi kayıtlarınıza dokunulmaz.', () => {
      snap();
      db.appts = db.appts.filter(a => !a.sample); db.cash = db.cash.filter(c => !c.sample); db.debts = db.debts.filter(d => !d.sample);
      sbSyncFull(); render(); toast('Örnek veriler temizlendi', true);
    });
  },
  voice: () => openVoice(),
  mictoggle: () => { if (listening) { stopListening(); micState(false); setStat('Mikrofona dokunup konuşun'); } else startListening(); },
  vsend: () => { stopListening(); micState(false); runVoice(val('vin')); },
  ex: d => { stopListening(); micState(false); const i = $('#vin'); if (i) i.value = d.t; runVoice(d.t); },
  vok: () => { if (pending) applyIntent(pending); },
  vagain: () => { pending = null; const i = $('#vin'); if (i) i.value = ''; const r = $('#vres'); if (r) r.innerHTML = ''; startListening(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = actions[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'vin'){ e.preventDefault(); actions.vsend(); }
  if (e.key === 'Enter' && e.target.id === 'pin_in'){ e.preventDefault(); actions.unlock(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f_service'){ const o = el.selectedOptions[0]; if (o) $('#f_price').value = o.dataset.p; return; }
  if (el.id === 'c_cat'){ $('#c_empwrap').classList.toggle('hidden', el.value !== 'avans'); return; }
  if (el.id === 'd_phone'){ const a = db.appts.find(x => x.id === el.dataset.id); if (a){ a.phone = el.value.trim(); sbUpsertAppt(a); } return; }
  if (el.id === 'restoreIn'){
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || !o.settings || !Array.isArray(o.appts)) throw new Error('bad');
        askConfirm('Mevcut veriler yedekteki verilerle değiştirilsin mi?', () => {
          snap(); db = o; db.cash = db.cash || []; db.debts = db.debts || []; sbSyncFull(); render(); toast('Yedek geri yüklendi', true);
        });
      } catch (err){ toast('Geçersiz yedek dosyası'); }
      el.value = '';
    };
    r.readAsText(f); return;
  }
  const ch = el.dataset && el.dataset.ch; if (!ch) return;
  const i = +el.dataset.i, S = db.settings;
  if (ch === 'emp'){
    const e2 = S.employees[i], old = e2.name, nv = el.value.trim();
    if (!nv){ el.value = old; return; }
    db.appts.forEach(a => { if (a.emp === old) a.emp = nv; }); db.cash.forEach(c => { if (c.emp === old) c.emp = nv; }); e2.name = nv;
  } else if (ch === 'rate'){ S.employees[i].rate = Math.max(0, Math.min(100, parseFloat(el.value) || 0)); el.value = S.employees[i].rate; }
  else if (ch === 'svname'){ const nv = el.value.trim(); if (!nv){ el.value = S.services[i].name; return; } S.services[i].name = nv; }
  else if (ch === 'svprice'){ S.services[i].price = Math.max(0, Math.min(999999, parseFloat(String(el.value).replace(',','.')) || 0)); el.value = S.services[i].price; }
  sbSaveSettings(); render();
});
window.addEventListener('hashchange', () => { ui.mode = initialMode(); render(); });

/* ============ PWA (Manifest + İkon) ============ */
(function(){
  function icon(sz){
    const c = document.createElement('canvas'); c.width = c.height = sz; const x = c.getContext('2d');
    x.fillStyle = '#1e293b'; x.fillRect(0,0,sz,sz);
    const pw = sz*.32, ph = sz*.7, px = (sz-pw)/2, py = (sz-ph)/2;
    x.save(); x.beginPath();
    if (x.roundRect) x.roundRect(px, py, pw, ph, pw/2); else x.rect(px, py, pw, ph);
    x.clip(); x.fillStyle = '#fff'; x.fillRect(px, py, pw, ph);
    x.translate(sz/2, sz/2); x.rotate(-Math.PI/5); const st = sz*.09, cols = ['#dc2626','#ffffff','#2563eb'];
    for (let i = -14; i < 14; i++){ x.fillStyle = cols[((i%3)+3)%3]; x.fillRect(-sz, i*st, sz*2, st); }
    x.restore();
    return c.toDataURL('image/png');
  }
  try {
    const i512 = icon(512), i180 = icon(180);
    const man = {name:'Miraç Berber', short_name:'Miraç Berber', start_url:'.', display:'standalone', background_color:'#f1f5f9', theme_color:'#1e293b', lang:'tr', icons:[{src:i512, sizes:'512x512', type:'image/png'}]};
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:'application/manifest+json'}));
    document.head.appendChild(l);
    const ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = i180; document.head.appendChild(ai);
    const fi = document.createElement('link'); fi.rel = 'icon'; fi.href = i180; document.head.appendChild(fi);
  } catch(e){}
})();

/* ============ Başlat ============ */
loadLocal();
if (initSupabase()){
  syncFromSupabase(false);
  if (sbSyncTimer) clearInterval(sbSyncTimer);
  sbSyncTimer = setInterval(() => syncFromSupabase(true), 15000);
}
render();
</script>
